    category: "uip"
    pypi_id: "mace-torch"
    description: "MACE-MP-0 and MACE-MPA-0 (MIT); MACE-OMAT-0, MACE-MATPES-PBE-0 / -r2SCAN-0, MACE-OMOL-0 and the multi-head MACE-MH-1 (ASL)."
    labels: ["w-mit", "w-asl", "pbe", "r2scan", "wb97m", "multi-head"]
  - name: "MACE-OFF"
    license: "https://github.com/ACEsuit/mace-off/blob/HEAD/LICENSE.md"
    github_id: "ACEsuit/mace-off"
    category: "uip"
    description: "MACE-OFF23 and OFF24 for neutral organic molecules, trained on SPICE at wB97M-D3(BJ)/def2-TZVPPD."
    labels: ["w-asl", "wb97m", "molecules"]
  - name: "fairchem"
    license: "MIT"
    github_id: "facebookresearch/fairchem"
    category: "uip"
    pypi_id: "fairchem-core"
    description: "eqV2, eSEN and UMA models trained on OMat24, OMol25, OC20 and related FAIR datasets. UMA weights are gated on Hugging Face."
    labels: ["w-meta", "pbe", "wb97m", "multi-head"]
  - name: "CHGNet"
    license: "BSD-3-Clause"
    github_id: "CederGroupHub/chgnet"
    category: "uip"
