configuration:
  min_stars: 5
  max_trending_projects: 5
  allowed_licenses: ["all"]
  require_license: false
  hide_license_risk: true
  require_repo: false
  max_description_length: 300
  ascii_description: false
  min_projectrank: 0
  hide_empty_categories: true
  markdown_header_file: "config/header.md"
  markdown_footer_file: "config/footer.md"
  projects_history_folder: "history"

categories:
  - category: "uip"
    title: "Universal potentials"
    subtitle: "Pretrained interatomic potentials meant to be used across most of the periodic table. Labels give the license of the weights (which can differ from the code license) and the level of theory of the training data."
  - category: "ml-iap"
    title: "MLIP codes"
    subtitle: "Codes for building and training machine-learned interatomic potentials."
  - category: "md"
    title: "Simulation"
    subtitle: "MD engines, plugins and calculators that run machine-learned potentials."
  - category: "active-learning"
    title: "Active learning and fine-tuning"
    subtitle: "Workflows that generate training data, fit or fine-tune potentials iteratively."
  - category: "datasets"
    title: "Datasets"
    subtitle: "Training data used by the potentials above."
  - category: "benchmarks"
    title: "Benchmarks"
    subtitle: "Leaderboards and test suites for machine-learned potentials."

labels:
  # License of the released weights
  - label: "w-mit"
    name: "weights: MIT"
  - label: "w-apache"
    name: "weights: Apache-2.0"
  - label: "w-bsd"
    name: "weights: BSD-3"
  - label: "w-ccby"
    name: "weights: CC-BY-4.0"
  - label: "w-gpl"
    name: "weights: GPL-3.0"
  - label: "w-lgpl"
    name: "weights: LGPL-3.0"
  - label: "w-asl"
    name: "weights: ASL (non-commercial)"
    url: "https://github.com/gabor1/ASL"
  - label: "w-ccbyncsa"
    name: "weights: CC-BY-NC-SA-4.0"
  - label: "w-meta"
    name: "weights: custom (Meta)"
  - label: "w-unstated"
    name: "weights: not stated"
  # Level of theory of the training data
  - label: "pbe"
    name: "PBE(+U)"
  - label: "r2scan"
    name: "r2SCAN"
  - label: "pbesol"
    name: "PBEsol"
  - label: "wb97m"
    name: "ωB97M"
  - label: "pbe0-mbd"
    name: "PBE0+MBD"
  - label: "multi-head"
    name: "multi-head"
  # Domain
  - label: "molecules"
    name: "molecules"

projects:
  # ---------------- Universal potentials ----------------
