# Foundation models trained on levels of theory or chemistry that Matbench Discovery does not test.
# Each entry was checked against the linked repository, model card or paper on 2026-10-21.
- name: MatPES models (TensorNet, M3GNet, CHGNet, QET)
  repo: https://github.com/materialyzeai/matgl
  domain: bulk inorganic
  theory: PBE and r2SCAN, no +U
  data: MatPES, 434,712 PBE and 387,897 r2SCAN calculations
  license: not stated on the model cards (code BSD-3-Clause)
  license_class: custom
  paper: https://arxiv.org/abs/2503.04070
  paper_label: arXiv:2503.04070
- name: MACE-MATPES-PBE-0 / -r2SCAN-0
  repo: https://github.com/ACEsuit/mace-foundations
  domain: bulk inorganic, 89 elements
  theory: PBE (no +U) or r2SCAN
  data: MatPES, fine-tuned from MACE-OMAT-0
  license: ASL
  license_class: non-commercial
  paper: https://arxiv.org/abs/2503.04070
  paper_label: arXiv:2503.04070 (data)
- name: UMA
  repo: https://github.com/facebookresearch/fairchem
  domain: all-purpose, one task head per domain
  theory: "PBE(+U) (omat), ωB97M-V/def2-TZVPD (omol), RPBE (oc20), PBE+D3 (omc, odac)"
  data: OMat24, OMol25, OC20, OMC25, ODAC25
  license: FAIR Chemistry License, gated
  license_url: https://huggingface.co/facebook/UMA
  license_class: custom
  paper: https://arxiv.org/abs/2506.23971
  paper_label: arXiv:2506.23971
- name: MACE-MH-1
  repo: https://huggingface.co/mace-foundations/mace-mh-1
  domain: all-purpose, multi-head, 89 elements
  theory: "PBE(+U), r2SCAN, ωB97M-V, ωB97M-D3(BJ), B3LYP (one head each)"
  data: OMat24 pre-training, then OMol25 subset, SPICE, RGD1, OC20, MatPES
  license: ASL
  license_class: non-commercial
  paper: https://arxiv.org/abs/2510.25380
  paper_label: arXiv:2510.25380
- name: DPA-3.1-3M
  repo: https://github.com/deepmodeling/deepmd-kit
  domain: all-purpose, multi-head
  theory: "PBE(+U), PBEsol, SCAN, RPBE, ωB97M-D3(BJ), ωB97X and others (one head per dataset)"
  data: OpenLAM collection
  license: CC-BY-4.0
  license_url: https://huggingface.co/deepmodelingcommunity/DPA-3.1-3M
  license_class: permissive
  paper: https://doi.org/10.1038/s41524-026-02146-2
  paper_label: npj Comput. Mater. (2026)
- name: PET-MAD (UPET)
  repo: https://github.com/lab-cosmo/upet
  domain: all-purpose (bulk, surfaces, clusters, molecules)
  theory: PBEsol without spin (v1.0); r2SCAN (v1.5 and later)
  data: MAD, 95,595 structures, 85 elements (v1.0)
  license: BSD-3-Clause
  license_class: permissive
  paper: https://doi.org/10.1038/s41467-025-65662-7
  paper_label: Nat. Commun. (2025)
- name: MACE-OFF23 / OFF24
  repo: https://github.com/ACEsuit/mace-off
